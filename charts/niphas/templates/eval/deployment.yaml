apiVersion: apps/v1
kind: Deployment
metadata:
  name: niphas-eval
  namespace: {{ include "niphas.namespace" . }}
  labels:
    {{- include "niphas.labels" . | nindent 4 }}
    app.kubernetes.io/component: eval
    {{- include "niphas.selectorLabels" (dict "name" "niphas-eval" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.eval.replicas }}
  selector:
    matchLabels:
      {{- include "niphas.selectorLabels" (dict "name" "niphas-eval" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "niphas.labels" . | nindent 8 }}
        app.kubernetes.io/component: eval
        {{- include "niphas.selectorLabels" (dict "name" "niphas-eval" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: eval
          image: "{{ .Values.eval.image.repository }}:{{ .Values.eval.image.tag }}"
          imagePullPolicy: {{ .Values.eval.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.eval.targetPort }}
              protocol: TCP
          env:
            - name: NIPHAS_CONFIG
              value: /etc/niphas/config.yaml
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.eval.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/niphas
              readOnly: true
            - name: nix-var
              mountPath: /nix/var
            - name: nix-tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: niphas-config
        - name: nix-var
          emptyDir: {}
        - name: nix-tmp
          emptyDir: {}
