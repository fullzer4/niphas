apiVersion: v1
kind: ConfigMap
metadata:
  name: niphas-config
  namespace: {{ include "niphas.namespace" . }}
  labels:
    {{- include "niphas.labels" . | nindent 4 }}
data:
  config.yaml: |
    logLevel: {{ .Values.config.logLevel | quote }}
    binaryCaches:
      {{- range .Values.config.binaryCaches }}
      - url: {{ . | quote }}
      {{- end }}
    allowedFlakeOrigins:
      {{- range .Values.config.allowedFlakeOrigins }}
      - {{ . | quote }}
      {{- end }}
    evalWebhookUrl: {{ .Values.config.evalWebhookUrl | quote }}
    healthPort: {{ .Values.config.healthPort }}
    evalTimeout: {{ .Values.config.evalTimeout | quote }}
    cache:
      path: {{ .Values.config.cache.path | quote }}
      highWatermarkBytes: {{ .Values.config.cache.highWatermark }}
      lowWatermarkBytes: {{ .Values.config.cache.lowWatermark }}
      gcInterval: {{ .Values.config.cache.gcInterval | quote }}
