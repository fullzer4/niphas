{{- if .Values.docs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: niphas-docs
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: niphas-docs
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.docs.service.type }}
  ports:
    - port: {{ .Values.docs.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: niphas-docs
{{- end }}
