name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── L1: fast checks (all parallel) ───────────────
  fmt:
    name: "L1 · fmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build .#checks.x86_64-linux.fmt -L

  clippy:
    name: "L1 · clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build .#checks.x86_64-linux.clippy -L

  deny:
    name: "L1 · deny"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build .#checks.x86_64-linux.deny -L

  test:
    name: "L1 · test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build .#checks.x86_64-linux.nextest -L

  # ── L2: integration tests (parallel, gate on L1) ─
  eval-http:
    name: "L2 · Eval HTTP"
    needs: [fmt, clippy, deny, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build .#checks.x86_64-linux.eval-http -L

  csi-grpc:
    name: "L2 · CSI gRPC"
    needs: [fmt, clippy, deny, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build .#checks.x86_64-linux.csi-grpc -L

  # ── L3: E2E (gates on L2) ───────────────────────
  e2e-kind:
    name: "L3 · E2E Kind"
    needs: [eval-http, csi-grpc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build images
        run: nix build .#all-images -o result-images

      - uses: helm/kind-action@v1
        with:
          cluster_name: niphas-test
          config: hack/kind-config.yaml

      - name: Load images
        run: |
          kind load image-archive result-images/operator.tar.gz --name niphas-test
          kind load image-archive result-images/eval.tar.gz --name niphas-test
          kind load image-archive result-images/csi.tar.gz --name niphas-test
          kind load image-archive result-images/runner.tar.gz --name niphas-test

      - name: Label nodes
        run: kubectl label nodes --all niphas.io/store=true

      - name: Verify CRD freshness
        run: |
          nix develop -c cargo run --bin niphas-crd-gen 2>/dev/null | grep -v '^niphas devShell ready$' | diff charts/niphas/crds/niphasworkloads.yaml -

      - name: Install niphas
        run: |
          nix develop -c helm install niphas charts/niphas \
            --namespace niphas-system \
            --create-namespace \
            --set operator.image.pullPolicy=Never \
            --set operator.image.tag=dev \
            --set eval.image.pullPolicy=Never \
            --set eval.image.tag=dev \
            --set eval.resources.limits.memory=4Gi \
            --set csi.image.pullPolicy=Never \
            --set csi.image.tag=dev \
            --set runner.image.tag=dev \
            --set docs.enabled=true \
            --set docs.flakeRef=github:NixOS/nixpkgs \
            --set docs.attribute=legacyPackages.x86_64-linux.hello

      - name: Wait for control plane
        run: |
          kubectl -n niphas-system rollout status deployment/niphas-operator --timeout=120s
          kubectl -n niphas-system rollout status deployment/niphas-eval --timeout=120s
          kubectl -n niphas-system rollout status daemonset/niphas-csi --timeout=120s

      - name: Wait for docs workload
        run: |
          for i in $(seq 1 150); do
            PHASE=$(kubectl -n niphas-system get niphasworkload niphas-docs -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "attempt $i: phase=$PHASE"
            [ "$PHASE" = "Running" ] && exit 0
            sleep 2
          done
          echo "FAIL: did not reach Running after 5 minutes"
          kubectl -n niphas-system get niphasworkload niphas-docs -o yaml || true
          exit 1

      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n niphas-system get pods -o wide
          kubectl -n niphas-system describe pods
          for l in niphas-csi niphas-operator niphas-eval; do
            echo "=== $l ===" && kubectl -n niphas-system logs -l app.kubernetes.io/name=$l --all-containers --tail=50 || true
          done
          kubectl -n niphas-system get niphasworkload niphas-docs -o yaml || true
          kubectl -n niphas-system get deployment -l niphas.io/workload=niphas-docs -o yaml || true
          kubectl -n niphas-system get events --sort-by=.lastTimestamp

      - name: Run E2E tests
        run: |
          kubectl create namespace niphas-e2e
          kubectl -n niphas-system port-forward svc/niphas-eval 8443:8443 &
          kubectl -n niphas-system port-forward deployment/niphas-operator 8080:8080 &
          sleep 5
          nix develop -c cargo nextest run -p niphas-e2e --test '*'
        env:
          OPERATOR_HEALTH_URL: http://localhost:8080/healthz
          EVAL_HEALTH_URL: http://localhost:8443/healthz
          E2E_NAMESPACE: niphas-e2e
