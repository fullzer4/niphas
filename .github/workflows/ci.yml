name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Layer 1 (all parallel) ─────────────────────
  fmt:
    name: "L1 · Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop -c cargo fmt --check

  clippy:
    name: "L1 · Clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: "L1 · Deny"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop -c cargo deny check

  unit:
    name: "L1 · Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop -c cargo nextest run --workspace --lib --bins

  # ── Layer 2 (all parallel, gates on layer 1) ───
  eval-http:
    name: "L2 · Eval HTTP"
    needs: [fmt, clippy, deny, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop -c cargo nextest run -p niphas-eval --test '*'

  csi-grpc:
    name: "L2 · CSI gRPC"
    needs: [fmt, clippy, deny, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop -c cargo nextest run -p niphas-csi --test '*'

  # ── Layer 3 (gates on layer 2) ─────────────────
  e2e-kind:
    name: "L3 · E2E Kind"
    needs: [eval-http, csi-grpc]
    runs-on: ubuntu-latest
    if: false  # placeholder — enable when container images exist
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: helm/kind-action@v1
        with:
          cluster_name: niphas-test
      - run: nix develop -c cargo nextest run --workspace --test 'e2e_*'
