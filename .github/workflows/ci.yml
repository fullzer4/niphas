name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── L1: fast checks (all parallel) ───────────────
  fmt:
    name: "L1 · fmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: "L1 · clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler
      - run: cargo clippy --workspace --all-targets -- --deny warnings

  deny:
    name: "L1 · deny"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  test:
    name: "L1 · test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler
      - run: cargo nextest run --workspace --exclude niphas-e2e

  # ── L2: integration tests (parallel, gate on L1) ─
  eval-http:
    name: "L2 · Eval HTTP"
    needs: [fmt, clippy, deny, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler
      - run: cargo nextest run -p niphas-eval --test '*'

  csi-grpc:
    name: "L2 · CSI gRPC"
    needs: [fmt, clippy, deny, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler
      - run: cargo nextest run -p niphas-csi --test '*'

  # ── L3: E2E (gates on L2) ───────────────────────
  e2e-kind:
    name: "L3 · E2E Kind"
    needs: [eval-http, csi-grpc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Build Docker images
        run: |
          docker build -t ghcr.io/fullzer4/niphas-operator:dev -f Dockerfile.operator .
          docker build -t ghcr.io/fullzer4/niphas-eval:dev -f Dockerfile.eval .
          docker build -t ghcr.io/fullzer4/niphas-csi:dev -f Dockerfile.csi .
          docker build -t ghcr.io/fullzer4/niphas-runner:dev -f Dockerfile.runner .

      - uses: helm/kind-action@v1
        with:
          cluster_name: niphas-test
          config: hack/kind-config.yaml

      - name: Load images into kind
        run: |
          kind load docker-image ghcr.io/fullzer4/niphas-operator:dev --name niphas-test
          kind load docker-image ghcr.io/fullzer4/niphas-eval:dev --name niphas-test
          kind load docker-image ghcr.io/fullzer4/niphas-csi:dev --name niphas-test
          kind load docker-image ghcr.io/fullzer4/niphas-runner:dev --name niphas-test

      - name: Label nodes
        run: kubectl label nodes --all niphas.io/store=true

      - name: Verify CRD freshness
        run: |
          cargo run --bin niphas-crd-gen 2>/dev/null | diff charts/niphas/crds/niphasworkloads.yaml -

      - name: Install niphas
        run: |
          helm install niphas charts/niphas \
            --namespace niphas-system \
            --create-namespace \
            --set operator.image.pullPolicy=Never \
            --set operator.image.tag=dev \
            --set eval.image.pullPolicy=Never \
            --set eval.image.tag=dev \
            --set eval.resources.limits.memory=4Gi \
            --set csi.image.pullPolicy=Never \
            --set csi.image.tag=dev \
            --set runner.image.tag=dev \
            --set docs.enabled=true \
            --set docs.flakeRef=github:NixOS/nixpkgs \
            --set docs.attribute=legacyPackages.x86_64-linux.hello

      - name: Wait for control plane
        run: |
          kubectl -n niphas-system rollout status deployment/niphas-operator --timeout=120s
          kubectl -n niphas-system rollout status deployment/niphas-eval --timeout=120s
          kubectl -n niphas-system rollout status daemonset/niphas-csi --timeout=120s

      - name: Wait for docs workload
        run: |
          for i in $(seq 1 150); do
            PHASE=$(kubectl -n niphas-system get niphasworkload niphas-docs -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "attempt $i: phase=$PHASE"
            [ "$PHASE" = "Running" ] && exit 0
            sleep 2
          done
          echo "FAIL: did not reach Running after 5 minutes"
          kubectl -n niphas-system get niphasworkload niphas-docs -o yaml || true
          exit 1

      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n niphas-system get pods -o wide
          kubectl -n niphas-system describe pods
          for l in niphas-csi niphas-operator niphas-eval; do
            echo "=== $l ===" && kubectl -n niphas-system logs -l app.kubernetes.io/name=$l --all-containers --tail=50 || true
          done
          kubectl -n niphas-system get niphasworkload niphas-docs -o yaml || true
          kubectl -n niphas-system get deployment -l niphas.io/workload=niphas-docs -o yaml || true
          kubectl -n niphas-system get events --sort-by=.lastTimestamp

      - name: Run E2E tests
        run: |
          kubectl create namespace niphas-e2e
          kubectl -n niphas-system port-forward svc/niphas-eval 8443:8443 &
          kubectl -n niphas-system port-forward deployment/niphas-operator 8080:8080 &
          sleep 5
          cargo nextest run -p niphas-e2e --test '*'
        env:
          OPERATOR_HEALTH_URL: http://localhost:8080/healthz
          EVAL_HEALTH_URL: http://localhost:8443/healthz
          E2E_NAMESPACE: niphas-e2e
