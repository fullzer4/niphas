[workspace]
resolver = "2"
members = [
    "crates/niphas-core",
    "crates/niphas-eval",
    "crates/niphas-operator",
    "crates/niphas-csi",
    "crates/niphas-mesh",
    "crates/niphas-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/fullzer4/niphas"
rust-version = "1.88"

[workspace.dependencies]
kube = { version = "3.1", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.27", features = ["latest", "schemars"] }
kube-runtime = "3.1"
kube-leader-election = "0.43"
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "time", "signal", "macros", "process"] }
tokio-util = "0.7"
axum = "0.8"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "catch-panic"] }
tonic = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"
tonic-prost = "0.14"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
schemars = "1"
figment = { version = "0.10", features = ["env", "yaml"] }
tikv-jemallocator = { version = "0.7", features = ["profiling", "stats"] }
bytes = "1"
futures = "0.3"
async-compression = { version = "0.4", features = ["tokio", "zstd", "xz", "bzip2"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
niphas-core = { path = "crates/niphas-core" }

[profile.dev]
debug = 1
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0

[profile.release.build-override]
opt-level = 3

[profile.release.package."*"]
opt-level = 3

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
